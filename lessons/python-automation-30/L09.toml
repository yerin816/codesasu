# L09 초안 (10/13) - 폰 미리보기 점검 후 published = true로 바꾸면 공개
order_no = 9
track = "error"
title = "날짜는 모양이 같아야 읽힌다"
est_minutes = 9
published = false
body = '''
엑셀이나 여러 사람에게 받은 날짜는 2026-10-12, 2026.10.12, 2026/10/12처럼 모양이 섞여 있을 때가 많아요.

`datetime.strptime(글자, 모양)`은 글자를 날짜로 바꿔요. 모양의 `%Y`는 연도 4자리, `%m`은 월, `%d`는 일이에요. `"%Y-%m-%d"`는 '연-월-일' 모양이라는 뜻이에요.

글자와 모양이 한 글자라도 다르면 `ValueError: time data ... does not match format ...` 에러가 나요. '이 글자는 정한 모양과 다르다'는 뜻이라, 에러 메시지에 나온 글자를 정한 모양과 비교해 보면 돼요. `replace(".", "-")`로 구분 기호를 먼저 맞추면 읽을 수 있어요.

날짜를 따옴표 안 글자 그대로 비교하면 날짜가 아니라 글자를 앞에서부터 한 글자씩 비교해요. 그래서 "2026-9-5"가 "2026-10-12"보다 늦다고 나올 수 있어요. 날짜끼리 비교하려면 먼저 날짜로 바꿔야 해요.
'''

[[questions]]
qtype = "error"
prompt = "날짜 목록을 읽는데 첫 날짜는 잘 나오고, 5번째 줄에서 ValueError: time data '2026.10.12' does not match format '%Y-%m-%d' 에러가 났어요. 원인은 무엇일까요?"
code = '''
from datetime import datetime

rows = ["2026-10-02", "2026.10.12"]
for r in rows:
    d = datetime.strptime(r, "%Y-%m-%d")
    print(d.month, "월", d.day, "일")
'''
choices = [
    "10월 12일은 없는 날짜다",
    "두 번째 날짜는 점(.)으로 나뉘어 정한 모양(-)과 다르다",
    "from datetime 줄이 맨 위에 있으면 안 된다",
    "%Y는 연도를 두 자리만 읽는다",
]
answer = 2
explanation = "에러 메시지의 '2026.10.12'는 점(.)으로 나뉘어 있는데 정한 모양은 '%Y-%m-%d'(-)라서 맞지 않아요. r.replace(\".\", \"-\")로 먼저 바꾸면 두 날짜 모두 읽혀요. ① 10월 12일은 있는 날짜예요. ③ import 줄은 맨 위에 두는 게 맞아요. ④ %Y는 4자리 연도를 읽어서 첫 날짜는 잘 읽혔어요."
check = { error = "ValueError" }

[[questions]]
qtype = "predict"
prompt = "두 날짜 중 어느 쪽이 늦은지 비교하는 코드예요. 실행하면 무엇이 출력될까요?"
code = '''
a = "2026-9-5"
b = "2026-10-12"
if a > b:
    print("a가 더 늦다")
else:
    print("b가 더 늦다")
'''
choices = ["a가 더 늦다", "b가 더 늦다", "에러가 난다", "아무것도 안 나온다"]
answer = 1
explanation = "따옴표 안의 날짜는 글자라서 앞에서부터 한 글자씩 비교해요. '2026-'까지 같고, 다음 글자 '9'와 '1'을 비교하면 '9'가 커서 a가 늦다고 나와요. 실제로는 10월 12일이 더 늦어요. ② 실제 날짜로는 맞지만 코드는 글자로 비교해요. ③ 글자끼리 비교해도 에러는 나지 않아요. ④ if와 else 중 하나는 꼭 실행돼요."
