# L11 (10/13 작성, 폰 미리보기 점검 후 공개)
order_no = 11
track = "reading"
title = "표를 거르고 합치면 행 수부터 확인한다"
est_minutes = 10
published = true
body = '''
엑셀 표를 다룰 때 AI는 pandas를 자주 써요. `pd.DataFrame({...})`은 표를 만드는 줄이고, 따옴표 안 이름이 열 이름, 대괄호 안 값들이 그 열의 값이에요.

`df["지점"] == "강남"`은 행마다 참·거짓을 구해요. 이걸 `df[ ]` 안에 넣으면 참인 행만 남아요. 조건 두 개를 함께 쓸 때는 and 대신 `&`를 쓰고, 조건마다 괄호로 감싸야 해요. 괄호가 없으면 `&`를 먼저 계산해서 엉뚱한 비교가 되고 에러가 나요.

```
cond = (s >= 100) & (s < 150)
```

`merge`는 두 표를 같은 열(예: 거래처)을 기준으로 합쳐요. 한쪽 표에 같은 거래처가 두 번 있으면 합친 표의 행도 그만큼 늘어나요. 그래서 거르거나 합친 뒤에는 `len(df)`로 행 수를 한 번 확인하는 습관이 좋아요.
'''

[[questions]]
qtype = "predict"
prompt = "강남 지점 중 매출 100 이상인 행만 남기는 코드예요. 실행하면 무엇이 출력될까요?"
code = '''
import pandas as pd

names = ["강남", "홍대", "강남", "판교"]
df = pd.DataFrame({
    "지점": names,
    "매출": [120, 80, 50, 200],
})
gangnam = df["지점"] == "강남"
big = df[gangnam & (df["매출"] >= 100)]
print(len(big))
'''
choices = ["2", "1", "3", "0"]
answer = 2
explanation = "강남이면서 매출 100 이상인 행은 첫 행(강남, 120) 하나라 1이에요. ①은 강남 행만 센 경우, ③은 & 를 '둘 중 하나만 맞아도'(or)로 읽은 경우(강남 120, 강남 50, 판교 200), ④는 강남의 매출을 50으로만 본 경우예요."

[[questions]]
qtype = "predict"
prompt = "주문 표에 거래처 담당자를 붙이는 코드예요. 합친 표의 행 수는 몇 개일까요?"
code = '''
import pandas as pd

orders = pd.DataFrame({
    "거래처": ["A", "B"],
    "주문": [10, 20],
})
info = pd.DataFrame({
    "거래처": ["A", "A", "B"],
    "담당": ["김", "이", "박"],
})
m = orders.merge(info, on="거래처")
print(len(m))
'''
choices = ["2", "5", "3", "6"]
answer = 3
explanation = "info에 거래처 A가 두 번(김, 이) 있어서 A 주문은 두 행으로 늘어나요. A 2행 + B 1행 = 3행이에요. ①은 주문 표 행 수가 그대로라고 본 경우, ②는 두 표 행을 더한 경우, ④는 모든 짝을 다 만든다고 본 경우예요. 주문 합계를 내면 A 주문 10이 두 번 더해지니 조심해야 해요."

[[questions]]
qtype = "fix_line"
prompt = "매출 100 이상 150 미만인 지점 수를 세려는데 7번째 줄에서 ValueError: The truth value of a Series is ambiguous 에러가 났어요. 어떻게 고쳐야 할까요?"
code = '''
import pandas as pd

df = pd.DataFrame({
    "매출": [120, 80, 200],
})
s = df["매출"]
cond = s >= 100 & s < 150
print(len(df[cond]))
'''
choices = [
    "7번째 줄의 & 를 and로 바꾼다",
    "7번째 줄의 두 조건을 각각 괄호로 감싼다",
    "7번째 줄의 150을 200으로 바꾼다",
    "8번째 줄의 len( )을 지운다",
]
answer = 2
explanation = "괄호가 없으면 100 & s를 먼저 계산해서 비교가 엉켜 에러가 나요. (s >= 100) & (s < 150)처럼 감싸면 120 하나가 남아 1이 나와요. ① 표의 조건에 and를 쓰면 같은 에러가 나요. ③ 숫자를 바꿔도 괄호가 없어 같은 에러예요. ④ 에러는 7번째 줄에서 나서 그대로예요."

