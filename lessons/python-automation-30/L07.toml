# L07 초안 (10/13) - 폰 미리보기 점검 후 published = true로 바꾸면 공개
order_no = 7
track = "error"
title = "에러 메시지는 맨 아랫줄부터 읽는다"
est_minutes = 9
published = false
body = '''
에러가 나면 Traceback으로 시작하는 여러 줄이 나와요. 길어 보여도 읽을 곳은 두 군데예요. 맨 아랫줄은 '무슨 에러인지', 그 바로 위 `line 숫자`는 '몇 번째 줄에서 났는지'예요.

맨 아랫줄은 `에러 종류: 원인` 모양이에요. 에러 종류만 알아도 어디를 볼지 좁혀져요.

TypeError는 종류가 다른 값끼리 계산하거나 이어 붙일 때 나요. 예를 들어 글자("명")에 숫자(12)를 + 로 이어 붙이면 `can only concatenate str (not "int") to str`, 즉 '글자에는 글자만 이어 붙일 수 있다'는 에러가 나요. 숫자를 str( )로 감싸 글자로 바꾸면 돼요.

IndexError는 목록에 없는 순번을 찾을 때 나요. 파이썬 목록의 순번은 0부터 시작해서, 값이 3개인 목록의 순번은 0, 1, 2예요. 3번을 찾으면 `list index out of range`, 즉 '목록 범위를 벗어났다'는 에러가 나요.
'''

[[questions]]
qtype = "error"
prompt = "신규 고객 수를 안내 문구로 만드는데 2번째 줄에서 TypeError: can only concatenate str (not \"int\") to str 에러가 났어요. 무슨 뜻일까요?"
code = '''
count = 12
msg = "이번 달 신규 고객 " + count + "명"
print(msg)
'''
choices = [
    "count라는 이름표가 없다",
    "print 줄에 오타가 있다",
    "한글은 + 로 이어 붙일 수 없다",
    "글자에 숫자를 그대로 이어 붙이려 했다",
]
answer = 4
explanation = "에러 메시지는 '글자(str)에는 글자만 이어 붙일 수 있는데 숫자(int)가 왔다'는 뜻이에요. count가 숫자 12라서 나요. str(count)로 바꾸면 '이번 달 신규 고객 12명'이 나와요. ① 이름표가 없으면 NameError가 나요. ② 에러는 2번째 줄에서 났고 print는 3번째 줄이에요. ③ 한글 글자끼리는 + 로 잘 이어 붙어요."
check = { error = "TypeError" }

[[questions]]
qtype = "error"
prompt = "8~10월 매출을 출력하려는데 9월부터 나오고, 마지막에 IndexError: list index out of range 에러가 났어요. 원인은 무엇일까요?"
code = '''
months = ["8월", "9월", "10월"]
sales = [120, 95, 140]
for i in range(1, 4):
    print(months[i], sales[i])
'''
choices = [
    "순번은 0부터인데 1부터 세서 없는 3번을 찾았다",
    "months와 sales의 개수가 다르다",
    "10월만 글자 수가 달라서 읽지 못했다",
    "print에는 값을 하나만 넣을 수 있다",
]
answer = 1
explanation = "range(1, 4)는 1, 2, 3을 차례로 꺼내요. 목록 순번은 0부터라서 1부터 세면 8월(0번)을 건너뛰고, 마지막에 없는 3번을 찾아 에러가 나요. ② 두 목록 모두 값이 3개예요. ③ 글자 수와 순번은 상관없어요. ④ print에는 값을 여러 개 넣을 수 있어서 '9월 95'처럼 나왔어요."
check = { error = "IndexError" }

[[questions]]
qtype = "fix_line"
prompt = "위 코드에서 8월부터 10월까지 세 달이 모두 나오게 하려면 어떻게 고쳐야 할까요?"
code = '''
months = ["8월", "9월", "10월"]
sales = [120, 95, 140]
for i in range(1, 4):
    print(months[i], sales[i])
'''
choices = [
    "1번째 줄 months에 \"11월\"을 추가한다",
    "3번째 줄을 range(0, 3)으로 바꾼다",
    "4번째 줄에서 sales[i]를 지운다",
    "3번째 줄을 range(1, 3)으로 바꾼다",
]
answer = 2
explanation = "range(0, 3)은 0, 1, 2를 꺼내서 세 달이 모두 나와요. ① months는 4개가 되지만 sales는 3개라 여전히 에러가 나고 8월도 빠져요. ③ 매출이 빠지고 3번을 찾는 에러는 그대로예요. ④ 에러는 사라지지만 8월이 빠져요."

[questions.check]
line = 3
fix = "for i in range(0, 3):"
expect = '''
8월 120
9월 95
10월 140
'''
wrong = [
    { choice = 1, line = 1, fix = 'months = ["8월", "9월", "10월", "11월"]' },
    { choice = 3, line = 4, fix = "    print(months[i])" },
    { choice = 4, line = 3, fix = "for i in range(1, 3):" },
]
