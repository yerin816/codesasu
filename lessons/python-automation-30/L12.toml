# L12 (10/13 작성, 폰 미리보기 점검 후 공개)
order_no = 12
track = "shipping"
title = "AI에게 다시 물을 때 넘길 것과 넘기면 안 되는 것"
est_minutes = 8
published = true
body = '''
코드에서 에러가 나면 AI에게 다시 물어보는 게 가장 빨라요. 이때 무엇을 넘기느냐에 따라 답의 질과 회사 정보의 안전이 갈려요.

꼭 넘길 것은 세 가지예요. 에러 메시지 전체(Traceback 여러 줄을 잘라 내지 않고), 문제가 난 코드, 그리고 원래 하려던 일이에요. '고쳐 주세요'만 쓰면 AI는 하려던 일을 짐작해서 엉뚱하게 고칠 수 있어요.

넘기면 안 되는 것도 있어요. 고객 이름·전화번호 같은 개인정보, 비밀번호와 API 키, 회사 내부 자료예요. 코드에 이런 값이 들어 있으면 보내기 전에 '고객1', '010-0000-0001'처럼 가짜 값으로 바꾸세요. 형식만 같으면 AI가 문제를 찾는 데는 지장이 없어요.

회사마다 외부 AI에 무엇을 넣어도 되는지 규정이 다를 수 있어요. 처음 쓰기 전에 사내 규정을 한 번 확인해 두세요.
'''

[[questions]]
qtype = "fix_line"
prompt = "6번째 줄에서 에러가 나서 이 코드를 AI에게 보내려 해요. 2~3번째 줄은 실제 고객 명단이에요. 보내기 전에 꼭 해야 할 일은?"
code = '''
customers = [
    ("김하늘", "010-1111-2222"),
    ("이도윤", "010-3333-4444"),
]
for name, phone in customers:
    print(name, phone[13])
'''
choices = [
    "6번째 줄의 print를 지운다",
    "2~3번째 줄의 이름·전화번호를 가짜 값으로 바꾼다",
    "에러 메시지는 빼고 코드만 보낸다",
    "1번째 줄 customers를 한글 이름으로 바꾼다",
]
answer = 2
explanation = "실제 고객의 이름과 전화번호는 개인정보라 외부 AI에 그대로 넣으면 안 돼요. '고객1', '010-0000-0001'처럼 형식이 같은 가짜 값으로 바꿔도 에러 원인을 찾는 데는 문제없어요. ① 에러가 난 줄을 지우면 AI가 원인을 볼 수 없어요. ③ 에러 메시지는 꼭 같이 보내야 해요. ④ 변수 이름은 개인정보가 아니에요."
check = { run = false, why = "보내기 전 점검 문제라 실행 결과로 가를 수 없음" }

[[questions]]
qtype = "error"
prompt = "가짜 값으로 바꾼 뒤 실행해도 IndexError: string index out of range 에러가 나요. 전화번호 뒷자리 4개를 출력하려던 거예요. AI에게 함께 보낼 내용으로 가장 알맞은 것은?"
code = '''
customers = [
    ("고객1", "010-0000-0001"),
    ("고객2", "010-0000-0002"),
]
for name, phone in customers:
    print(name, phone[13])
'''
choices = [
    "'안 돼요, 고쳐 주세요' 한 줄",
    "에러 메시지 마지막 줄만",
    "실제 고객 명단 파일 전체",
    "에러 메시지 전체 + 코드 + '뒷자리 4개를 출력하려 했다'",
]
answer = 4
explanation = "에러 메시지 전체와 코드, 하려던 일을 같이 보내야 AI가 정확히 고쳐요. 전화번호는 13글자라 순번이 0~12까지인데 13번을 찾아 에러가 났고, 뒷자리 4개라는 목적을 알면 phone[-4:]처럼 고쳐 줄 수 있어요. ① 하려던 일을 몰라 짐작으로 고쳐요. ② 몇 번째 줄인지 같은 정보가 빠져요. ③ 개인정보라 보내면 안 되고, 원인을 찾는 데 필요하지도 않아요."
check = { error = "IndexError" }
