# L04 (10/12 작성, 폰 미리보기 점검 후 공개)
order_no = 4
track = "reading"
title = "글자로 된 숫자는 계산되지 않는다"
est_minutes = 8
published = true
body = '''
엑셀이나 웹에서 가져온 금액은 "1,200원"처럼 쉼표와 단위가 붙은 글자(문자열)일 때가 많아요. 따옴표로 감싼 값은 숫자처럼 보여도 글자라서, 더하면 계산 대신 이어 붙여져요. "100" + "200"은 "100200"이에요.

글자를 숫자로 바꾸는 게 `int()`예요. 다만 `int()`는 숫자로만 된 글자만 바꿀 수 있어서, 쉼표나 '원'이 남아 있으면 ValueError가 나요. 에러 메시지 끝의 따옴표 안에 바꾸지 못한 글자가 그대로 나와요.

그래서 먼저 글자를 다듬어요. `strip()`은 앞뒤 공백을 지우고, `replace(",", "")`는 쉼표를 빈 글자로 바꿔 지워요. 다듬은 뒤 `int()`로 바꾸면 계산할 수 있어요.

다듬기는 원래 값을 바꾸지 않고 다듬은 새 값을 돌려줘요. 그래서 `a = a.replace(",", "")`처럼 결과를 변수에 다시 담아야 해요.
'''

[[questions]]
qtype = "predict"
prompt = "두 금액을 더하려는 코드예요. 실행하면 무엇이 출력될까요?"
code = '''
a = "1,200"
b = "800"
a = a.replace(",", "")
print(a + b)
'''
choices = ["2000", "1,200800", "1200800", "에러가 난다"]
answer = 3
explanation = "replace로 쉼표를 지워 a는 \"1200\"이 됐지만 여전히 따옴표 안의 글자예요. 글자끼리 +는 이어 붙이기라 1200800이 나와요. ①은 숫자로 바뀌었다고 본 경우, ②는 3번째 줄에서 결과를 a에 다시 담은 것을 놓친 경우예요. ④ 글자끼리 더하기는 에러 없이 이어 붙여요."

[[questions]]
qtype = "error"
prompt = "주문 금액을 더하는데 5번째 줄에서 ValueError: invalid literal for int() with base 10: '12000원' 에러가 났어요. 원인은 무엇일까요?"
code = '''
prices = ["12,000원", "8,500원"]
total = 0
for p in prices:
    num = p.replace(",", "")
    total += int(num)
print(total)
'''
choices = [
    "total이 0이라서 더할 수 없다",
    "replace가 쉼표를 지우지 못했다",
    "쉼표는 지웠지만 '원'이 남아 숫자로 바꿀 수 없다",
    "prices에 금액이 2개뿐이다",
]
answer = 3
explanation = "에러 메시지 끝의 '12000원'이 int()가 바꾸지 못한 글자예요. 쉼표는 지워졌지만 '원'이 남아 있어요. num = p.replace(\",\", \"\").replace(\"원\", \"\")처럼 원도 지우면 20500이 나와요. ① 0에 숫자를 더하는 건 문제없어요. ② 메시지의 글자에 쉼표가 없으니 replace는 제대로 했어요. ④ 금액 개수와는 상관없어요."
check = { error = "ValueError" }
