# L02. 문제 순서 = 파일 안 [[questions]] 순서
order_no = 2
track = "error"
title = "에러와 이상한 결과는 원인이 적힌 줄부터 찾는다"
est_minutes = 8
published = true
body = '''
코드를 돌렸는데 에러가 나거나 결과가 이상하면, 원인이 적힌 줄을 거꾸로 찾아가면 돼요.

에러 메시지(Traceback)는 여러 줄이지만 마지막 줄부터 읽어요. 마지막 줄 앞부분은 에러 종류, 뒷부분은 에러 원인이에요. `KeyError: '부서'`는 '부서'라는 이름표(키)를 찾았는데 데이터에 없다는 뜻이에요. 엑셀로 치면 그런 열 이름이 없다는 말이라, 데이터의 열 이름과 한 글자씩 비교해 보면 돼요.

에러 없이 결과만 이상할 때는, 결과에 나온 값이 코드 어디서 처음 정해졌는지 찾아요. `this_month = "2026-09"`처럼 값을 코드에 직접 적어 두는 걸 하드코딩이라고 해요. 하드코딩된 날짜는 다음 달에 실행해도 바뀌지 않아요.

`startswith`는 글자가 '~로 시작하는지' 확인하는 기능이에요. 예를 들어 `"2026-10-02".startswith("2026-10")`은 참이에요.
'''

[[questions]]
qtype = "error"
prompt = "팀별 매출 표에서 부서와 매출을 출력하려는데 마지막 줄에 KeyError: '부서'가 났어요. 원인은 무엇일까요?"
code = '''
rows = [
    {"부서명": "영업", "매출": 120},
    {"부서명": "인사", "매출": 80},
]
for row in rows:
    print(row["부서"], row["매출"])
'''
choices = [
    "데이터에 '부서'라는 열 이름이 없다",
    "한글 열 이름은 파이썬에서 쓸 수 없다",
    "매출이 숫자라서 글자와 함께 출력할 수 없다",
    "파일을 찾지 못했다",
]
answer = 1
explanation = "KeyError는 찾는 이름표(키)가 데이터에 없을 때 난다. 코드는 '부서'를 찾는데 데이터의 열 이름은 '부서명'이다. ② 에러 메시지는 '부서' 하나만 가리키고, 데이터에는 '부서명'이라는 한글 열이 그대로 있으니 한글이라서 생긴 문제가 아니다. ③ print는 글자와 숫자를 함께 출력할 수 있다. ④ 코드에 파일을 여는 부분이 없고, 파일을 못 찾으면 FileNotFoundError가 난다"

[questions.check]
error = "KeyError"

[[questions]]
qtype = "fix_line"
prompt = "9월에 받은 '이번 달 매출 합계' 코드를 10월에 돌렸더니 9월 합계(300)가 나왔어요. 매달 실행한 달의 합계가 나오게 하려면 어떻게 고쳐야 할까요?"
code = '''
sales = [
    {"날짜": "2026-09-15", "금액": 300},
    {"날짜": "2026-10-02", "금액": 500},
    {"날짜": "2026-10-20", "금액": 200},
]
this_month = "2026-09"
total = 0
for s in sales:
    if s["날짜"].startswith(this_month):
        total += s["금액"]
print(this_month, "매출 합계:", total)
'''
choices = [
    "2~4번째 줄의 매출 날짜를 10월로 바꾼다",
    "6번째 줄에 실행한 날의 달이 들어가게 바꾼다",
    "9번째 줄의 startswith를 ==로 바꾼다",
    "11번째 줄에서 this_month를 지운다",
]
answer = 2
explanation = "6번째 줄에 '2026-09'를 직접 적어 둬서(하드코딩) 언제 실행해도 9월만 센다. 실행한 날의 달이 들어가게 바꾸면 10월에는 700이 나온다. startswith는 '~로 시작하는지' 확인하는 기능이다. ① 날짜를 바꾸면 '2026-09'로 시작하는 날짜가 없어 0이 되고, 데이터는 고칠 대상이 아니다. ③ ==는 날짜 전체가 '2026-09'와 똑같아야 해서 0이 된다. ④ 출력만 바뀌고 합계는 300 그대로다"

# 10월에 실행했다고 보고, 6번째 줄에 10월이 들어가면 700이 나와야 한다
[questions.check]
line = 6
fix = 'this_month = "2026-10"'
expect = "2026-10 매출 합계: 700"

[[questions.check.wrong]]
choice = 1
line = [2, 4]
fix = '''
    {"날짜": "2026-10-15", "금액": 300},
    {"날짜": "2026-10-02", "금액": 500},
    {"날짜": "2026-10-20", "금액": 200},
'''

[[questions.check.wrong]]
choice = 3
line = 9
fix = '    if s["날짜"] == this_month:'

[[questions.check.wrong]]
choice = 4
line = 11
fix = 'print("매출 합계:", total)'
